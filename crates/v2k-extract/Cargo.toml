[package]
name = "v2k-extract"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Canonical V2000 asset exporter backed by the Rust format parsers"

[dependencies]
v2k-formats = { path = "../v2k-formats" }
clap = { version = "4", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
