[package]
name = "v2k-render"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "OpenV2K — renderer abstraction with OpenGL and software backends"

[dependencies]
v2k-core = { path = "../v2k-core" }
v2k-formats = { path = "../v2k-formats" }
sdl2 = "0.38"
lewton = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17.16"

[dev-dependencies]
flate2 = "1"

[build-dependencies]
gl_generator = "0.14"
